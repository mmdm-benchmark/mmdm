[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmdm-eval"
version = "0.2.0"
description = "Evaluation toolkit for Measuring Massive Multitask Decision Making"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tokenizers>=0.20,<1", "huggingface-hub>=0.25,<3"]

[project.urls]
Homepage = "https://mmdm-benchmark.github.io"
Repository = "https://github.com/mmdm-benchmark/mmdm"
Dataset = "https://huggingface.co/datasets/shenjunhao/mmdm"

[project.scripts]
mmdm-eval = "mmdm_eval.runner:main"
mmdm-download = "mmdm_eval.download:main"
mmdm-score = "mmdm_eval.scoring:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmdm_eval*"]
